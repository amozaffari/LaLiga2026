name: Daily update

on:
  schedule:
    - cron: "17 5 * * *"   # 05:17 UTC every day
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch results + odds (football-data.co.uk)
        run: python -m liga_predict fetch

      - name: Simulate season (pure Elo)
        run: python -m liga_predict simulate

      - name: Simulate season (Polymarket-calibrated)
        continue-on-error: true   # a Polymarket outage degrades the site, not the run
        run: python -m liga_predict simulate --market-implied

      - name: Backtest
        run: python -m liga_predict backtest

      - name: Snapshot prediction history
        run: python -m liga_predict history

      - name: Render dashboard + history chart
        run: |
          python scripts/plot_predictions.py
          python scripts/plot_history.py

      - name: Build site
        run: python scripts/build_site.py

      - name: Commit history and cached raw data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add history data/raw
          git diff --cached --quiet || git commit -m "Daily update $(date -u +%F)"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
